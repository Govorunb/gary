name: publish

on: [workflow_dispatch]

jobs:
  publish:
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with: { fetch-depth: 0 }
    - run: git fetch --force --tags

    - name: Install dependencies (Ubuntu)
      if: contains(matrix.platform, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e
      with:
        toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

    - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      with:
        workspaces: src-tauri
        shared-key: ${{ matrix.platform }}-${{ env.RUSTUP_TOOLCHAIN }}

    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

    - name: Setup node
      uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
      with:
        node-version: latest
        cache: pnpm

    - name: Install frontend dependencies
      run: pnpm install
    
    - name: Build and upload assets
      uses: tauri-apps/tauri-action@390cbe447412ced1303d35abe75287949e43437a
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      with:
        tauriScript: pnpm tauri
        uploadWorkflowArtifacts: true
        tagName: v__VERSION__
        releaseName: 'v__VERSION__'
        releaseAssetNamePattern: '[name]-[version]_[platform]-[arch][ext]'
        releaseDraft: true

  # Launch the built bundles on clean systems before the draft release goes out.
  # "app/session/created" is logged by the frontend over IPC, so seeing it means the window, webview and IPC all work.
  smoke-linux:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'ubuntu:24.04', bundle: appimage, install: 'apt-get update && apt-get install -y xvfb libgl1-mesa-dri libegl1 libgles2 libgtk-3-0t64 fonts-dejavu-core' }
          - { image: 'ubuntu:26.04', bundle: appimage, install: 'apt-get update && apt-get install -y xvfb libgl1-mesa-dri libegl1 libgles2 libgtk-3-0t64 fonts-dejavu-core' }
          - { image: 'fedora:latest', bundle: appimage, install: 'dnf install -y xorg-x11-server-Xvfb mesa-dri-drivers mesa-libEGL libglvnd-gles gtk3 dejavu-sans-fonts' }
          - { image: 'archlinux:latest', bundle: appimage, install: 'pacman -Syu --noconfirm --needed xorg-server-xvfb mesa gtk3 ttf-dejavu' }
          - { image: 'ubuntu:24.04', bundle: deb, install: 'apt-get update && apt-get install -y xvfb ./dist/*.deb' }
          - { image: 'debian:13', bundle: deb, install: 'apt-get update && apt-get install -y xvfb ./dist/*.deb' }
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: 1
      DISPLAY: ':99'
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: linux-amd64-${{ matrix.bundle }}
        path: dist

    - run: ${{ matrix.install }}

    - name: Launch
      run: |
        Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
        if [ ${{ matrix.bundle }} = deb ]; then app=gary; else chmod +x dist/*.AppImage; app=$(echo dist/*.AppImage); fi
        $app > gary.log 2>&1 &
        pid=$!
        for _ in $(seq 60); do
          grep -q '"app/session/created"' gary.log && exit 0
          kill -0 $pid 2>/dev/null || break
          sleep 1
        done
        cat gary.log
        exit 1

  smoke-windows:
    needs: publish
    runs-on: windows-latest
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: windows-x64-nsis
        path: dist

    - name: Install and launch
      shell: pwsh
      run: |
        Start-Process (Get-Item dist\*-setup.exe) -ArgumentList /S -Wait
        $app = Start-Process (Get-Item "$env:LOCALAPPDATA\Gary\*.exe" -Exclude uninstall.exe) -PassThru
        $logs = "$env:LOCALAPPDATA\dev.govorunb.gary\logs\*"
        foreach ($i in 1..60) {
          if (Select-String -Path $logs -SimpleMatch '"app/session/created"' -Quiet -ErrorAction SilentlyContinue) { exit 0 }
          if ($app.HasExited) { break }
          Start-Sleep 1
        }
        Get-Content $logs -ErrorAction SilentlyContinue
        exit 1
